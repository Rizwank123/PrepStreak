<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect x="48" y="48" width="928" height="928" rx="190" ry="190" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.12"/>

  <!-- Code brackets (left) -->
  <path d="M 300 340 L 220 512 L 300 684" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#shadow)"/>

  <!-- Code brackets (right) -->
  <path d="M 724 340 L 804 512 L 724 684" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#shadow)"/>

  <!-- Outer flame -->
  <path d="M 512 250
           C 470 330, 430 380, 400 440
           C 370 500, 350 560, 350 620
           C 350 740, 420 800, 512 800
           C 604 800, 674 740, 674 620
           C 674 560, 654 500, 624 440
           C 594 380, 554 330, 512 250 Z"
        fill="url(#flame)" filter="url(#shadow)"/>

  <!-- Inner flame -->
  <path d="M 512 380
           C 486 430, 460 470, 442 510
           C 424 550, 414 590, 414 630
           C 414 710, 456 750, 512 750
           C 568 750, 610 710, 610 630
           C 610 590, 600 550, 582 510
           C 564 470, 538 430, 512 380 Z"
        fill="url(#flameInner)" opacity="0.85"/>

  <!-- Flame core highlight -->
  <ellipse cx="512" cy="640" rx="42" ry="60" fill="#ffffff" opacity="0.7"/>

  <!-- Streak dots (small sparks) -->
  <circle cx="420" cy="300" r="8" fill="#fbbf24" opacity="0.7"/>
  <circle cx="604" cy="310" r="6" fill="#fbbf24" opacity="0.6"/>
  <circle cx="512" cy="200" r="5" fill="#fbbf24" opacity="0.5"/>
</svg>
