<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="2436" viewBox="0 0 1242 2436">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1242" height="2436" fill="url(#bg)"/>

  <!-- Logo group centered -->
  <g transform="translate(621, 1000)">
    <!-- Code brackets -->
    <path d="M -120 -172 L -200 0 L -120 172" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <path d="M 120 -172 L 200 0 L 120 172" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Outer flame -->
    <path d="M 0 -260
             C -42 -180, -82 -130, -112 -70
             C -142 -10, -162 50, -162 110
             C -162 230, -92 290, 0 290
             C 92 290, 162 230, 162 110
             C 162 50, 142 -10, 112 -70
             C 82 -130, 42 -180, 0 -260 Z"
          fill="url(#flame)"/>

    <!-- Inner flame -->
    <path d="M 0 -130
             C -26 -80, -52 -40, -70 0
             C -88 40, -98 80, -98 120
             C -98 200, -56 240, 0 240
             C 56 240, 98 200, 98 120
             C 98 80, 88 40, 70 0
             C 52 -40, 26 -80, 0 -130 Z"
          fill="url(#flameInner)" opacity="0.85"/>

    <!-- Core highlight -->
    <ellipse cx="0" cy="130" rx="42" ry="60" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- App name -->
  <text x="621" y="1450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="82" font-weight="700" fill="#ffffff" letter-spacing="2">PrepStreak</text>

  <!-- Tagline -->
  <text x="621" y="1530" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#ffffff" opacity="0.7">Code every day. Ace every interview.</text>
</svg>
